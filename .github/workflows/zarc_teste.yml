name: ZARC (teste em ramo separado)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  zarc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: clima-teste }
      - run: |
          mkdir -p data/_diag
          python3 tools/zarc.py > data/_diag/zarc.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data; git commit -q -m "teste zarc" || true; git push origin HEAD:clima-teste
