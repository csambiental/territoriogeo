name: Curvas de nível
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  curvas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin libsqlite3-dev zlib1g-dev
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tc && make -C /tmp/tc -j4 -s && sudo make -C /tmp/tc install -s
          pip install -q "numpy<2" rasterio shapely scipy pystac-client planetary-computer
      - run: mkdir -p data/_diag data/relevo && python3 tools/curvas_nivel.py 2>&1 | tee data/_diag/curvas.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_diag data/relevo; git commit -q -m "Curvas de nível" || true; git pull -q --rebase origin main || true; git push
