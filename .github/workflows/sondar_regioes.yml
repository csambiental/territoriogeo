name: sondar regioes
on: workflow_dispatch
permissions: { contents: write }
jobs:
  r:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          for i in 1 2 3 4 5; do curl -sf --max-time 60 -A csambiental "https://servicodados.ibge.gov.br/api/v1/localidades/estados/41/municipios" -o /tmp/m.json && break; sleep 15; done
          python3 - <<'PY'
          import json, collections
          m = json.load(open('/tmp/m.json'))
          out = [{'cod': str(x['id']), 'nome': x['nome'], 'meso': x['microrregiao']['mesorregiao']['nome'], 'micro': x['microrregiao']['nome']} for x in m]
          json.dump(out, open('analise/data/municipios_pr.json', 'w'), ensure_ascii=False, indent=0)
          print(len(out), collections.Counter(o['meso'] for o in out))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analise/data/municipios_pr.json && git commit -qm "Lista de municípios do PR por região (IBGE)" && git push
