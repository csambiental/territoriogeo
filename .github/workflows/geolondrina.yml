name: GeoLondrina (lotes)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  lotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install shapely -q && mkdir -p data/_diag data/urbano && (if [ -f tools/baixar_lotes.py ]; then python3 tools/baixar_lotes.py > data/_diag/lotes.txt 2>&1; else python3 tools/descobrir_londrina.py > data/_diag/geolondrina.txt 2>&1; fi; true)
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_diag data/urbano; git commit -m "GeoLondrina: dados atualizados" || true; git pull --rebase origin main || true; git push
