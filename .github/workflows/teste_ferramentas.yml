name: Teste ferramentas do mapa
on: { workflow_dispatch: { inputs: { script: { required: false, default: teste_ferramentas.py } } } }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: mkdir -p /tmp/tf && (python3 tools/${{ inputs.script || 'teste_ferramentas.py' }} /tmp/tf 2>&1 | tee /tmp/tf/log.txt) || true
      - run: |
          cd /tmp/tf && git init -q -b teste-ferramentas && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m teste
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" teste-ferramentas
