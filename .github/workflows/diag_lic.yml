name: Diagnóstico licenças
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p analise/data/_diag && python3 analise/tools/diag_lic.py > analise/data/_diag/lic.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analise/data/_diag; git commit -q -m "diag licenças" || true; git pull -q --rebase origin main || true; git push
