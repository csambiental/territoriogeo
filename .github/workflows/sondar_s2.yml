name: Sondar Sentinel-2 (temporário)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          B=https://sentinel.arcgis.com/arcgis/rest/services/Sentinel2/ImageServer
          BB="-5720000,-2710000,-5717000,-2707000"
          echo "== CORS"; curl -s -m 30 -o /dev/null -D - -H "Origin: https://csambiental.github.io" "$B/exportImage?bbox=$BB&bboxSR=3857&size=256,256&f=image" | grep -i "access-control\|content-type"
          echo "== QUERY"; curl -s -m 60 "$B/query?where=category%3D1+AND+cloudcover%3C0.1&geometry=-51.37,-23.62&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=acquisitiondate,cloudcover,name,best&orderByFields=acquisitiondate+DESC&resultRecordCount=5&returnGeometry=false&f=json" | python3 -c "
          import json,sys,datetime; d=json.load(sys.stdin)
          for f in d.get('features',[]): a=f['attributes']; print(datetime.datetime.utcfromtimestamp(a['acquisitiondate']/1000).date(), a['cloudcover'], a['name'], a['best'])
          print(d.get('error'))"
          M=$(python3 -c "import json,urllib.parse;print(urllib.parse.quote(json.dumps({'mosaicMethod':'esriMosaicAttribute','sortField':'acquisitiondate','sortValue':'2099/12/31','ascending':True,'where':'category = 1 AND cloudcover <= 0.1','mosaicOperation':'MT_FIRST'})))")
          R=$(python3 -c "import json,urllib.parse;print(urllib.parse.quote(json.dumps({'rasterFunction':'Natural Color with DRA'})))")
          curl -s -m 60 -o a.jpg "$B/exportImage?bbox=$BB&bboxSR=3857&imageSR=3857&size=512,512&format=jpgpng&renderingRule=$R&mosaicRule=$M&f=image"; file -b a.jpg; wc -c < a.jpg
          R2=$(python3 -c "import json,urllib.parse;print(urllib.parse.quote(json.dumps({'rasterFunction':'NDVI Colormap'})))")
          curl -s -m 60 -o b.jpg "$B/exportImage?bbox=$BB&bboxSR=3857&imageSR=3857&size=512,512&format=jpgpng&renderingRule=$R2&mosaicRule=$M&f=image"; file -b b.jpg; wc -c < b.jpg
          R3=$(python3 -c "import json,urllib.parse;print(urllib.parse.quote(json.dumps({'rasterFunction':'NDVI Raw'})))")
          G=$(python3 -c "import json,urllib.parse;print(urllib.parse.quote(json.dumps({'rings':[[[-5720000,-2710000],[-5717000,-2710000],[-5717000,-2707000],[-5720000,-2707000],[-5720000,-2710000]]],'spatialReference':{'wkid':3857}})))")
          echo "== STATS"; curl -s -m 60 "$B/computeStatisticsHistograms?geometry=$G&geometryType=esriGeometryPolygon&renderingRule=$R3&mosaicRule=$M&pixelSize=10&f=json" | head -c 700; echo
          mkdir -p out && cp a.jpg b.jpg out/
      - uses: actions/upload-artifact@v4
        with: { name: s2, path: out }
