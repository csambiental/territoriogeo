name: Relatório Raio-X de exemplo (fictício)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install chromium
      - run: python3 tools/teste_relatorio.py https://csambiental.github.io/territoriogeo /tmp/ex
      - uses: actions/upload-artifact@v4
        with: { name: relatorio-exemplo, path: /tmp/ex }
      - name: Guardar no ramo exemplo-relatorio
        run: |
          cd /tmp/ex
          git init -q -b exemplo-relatorio && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Relatório de exemplo"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" exemplo-relatorio
