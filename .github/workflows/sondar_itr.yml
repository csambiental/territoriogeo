name: Sondar tabelas do ITR (temporário)
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          U=https://www.gov.br/receitafederal/pt-br/centrais-de-conteudo/publicacoes/documentos-tecnicos/vtn/tabela-vtn-2026-para-publicacao.pdf
          curl -sL -m 120 -A "Mozilla/5.0" $U | head -c 300; echo
          curl -sL -m 120 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -H "Accept: application/pdf,*/*" -H "Accept-Language: pt-BR,pt;q=0.9" -o v.pdf $U; ls -la v.pdf; head -c 200 v.pdf; echo
          curl -sL -m 120 -A "Mozilla/5.0" -o v2.pdf "$U/@@download/file"; ls -la v2.pdf; head -c 100 v2.pdf; echo
          curl -sI -m 60 $U | head -20
