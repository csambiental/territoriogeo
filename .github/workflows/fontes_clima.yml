name: Fontes clima (diagnóstico)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data/_diag && (timeout 1500 python3 tools/fontes_clima.py > data/_diag/fontes_clima.txt 2>&1; true)
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_diag; git commit -q -m "Fontes clima" || true; git pull -q --rebase origin main || true; git push
