name: CAR declarado (base temática SICAR)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  processar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /tmp
      - run: pip install -q gdown pyogrio
      - working-directory: analise
        run: python3 tools/car_declarado.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analise/data/car_declarado; git commit -q -m "CAR declarado (SICAR) por município" || true; git pull -q --rebase origin main; git push
